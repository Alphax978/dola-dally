<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect TikTok</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#111;background:#fff}
input{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:1px solid #ccc;border-radius:10px}
button{margin-top:14px;width:100%;padding:14px;font:600 16px system-ui;color:#fff;background:#111;border:0;border-radius:10px;cursor:pointer}
small{color:#666}
</style></head><body>
<h1>Connect TikTok</h1>
<p>Lets <b>dola-daily</b> send Mira AI's daily videos to your TikTok account. You can disconnect any time in TikTok → Settings → Security → Manage app permissions.</p>
<label for="k"><b>Client key</b> <small>(TikTok developer portal → dola-daily → Sandbox or Production)</small></label>
<input id="k" autocomplete="off" placeholder="aw1b2c3d4e5f…">
<button id="go">Connect TikTok</button>
<p><small>After you approve, TikTok sends you back to this site with a one-time code.</small></p>
<script>
var REDIRECT = "https://alphax978.github.io/dola-dally/";
var k = document.getElementById("k");
try { k.value = localStorage.getItem("tt_client_key") || ""; } catch (e) {}
document.getElementById("go").onclick = function () {
  var key = k.value.trim();
  if (!key) { k.focus(); return; }
  try { localStorage.setItem("tt_client_key", key); } catch (e) {}
  var state = Math.random().toString(36).slice(2);
  location.href = "https://www.tiktok.com/v2/auth/authorize/?" + new URLSearchParams({
    client_key: key, scope: "user.info.basic,video.upload,video.publish",
    response_type: "code", redirect_uri: REDIRECT, state: state }).toString();
};
</script></body></html>
