name: Voice diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pins: ["preshed==3.0.10", "preshed==3.0.10 cymem==2.0.11 murmurhash==1.0.13", "preshed==3.0.12", "preshed==3.0.10 cymem==2.0.11 murmurhash==1.0.13 spacy==3.8.7"]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          python3 -m venv v && . v/bin/activate
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile ${{ matrix.pins }} > /tmp/i.txt 2>&1 || tail -3 /tmp/i.txt
          python -m spacy download en_core_web_sm -q > /dev/null 2>&1 || true
          V=$(pip list 2>/dev/null | grep -iE "^(numpy|spacy|thinc|preshed|cymem|murmurhash|misaki) " | tr -s ' ' | tr '\n' ';')
          R=$(python -c "from kokoro import KPipeline; import numpy as np; p=KPipeline(lang_code='a'); a=np.concatenate([x for _,_,x in p('Testing the voice, shot two.', voice='af_heart')]); print('WORKS', len(a), flush=True)" 2>&1 | grep -E "WORKS|Error" | tail -2 | tr '\n' ' ')
          echo "::notice title=${{ matrix.pins }}::$R || $V"
