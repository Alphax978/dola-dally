name: Voice diagnostic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  posting_setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-v1-ubuntu-24.04
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install -q requests requests-oauthlib opencv-python-headless numpy cryptography pillow soundfile
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" > /tmp/k.txt 2>&1 || true
          {
            echo "== POSTING SETUP (system python)"; lsb_release -ds; python3 --version
            pip list 2>/dev/null | grep -iE "^(numpy|spacy|thinc|kokoro|misaki|torch|en.core|cython|srsly|blis|cymem|preshed|murmurhash) "
            python3 -c "import spacy; spacy.load('en_core_web_sm'); print('spacy load OK')" 2>&1 | tail -2
            python3 -c "from kokoro import KPipeline; KPipeline(lang_code='a'); print('kokoro OK')" 2>&1 | tail -3
            tail -5 /tmp/k.txt
          } > /tmp/post.txt 2>&1
      - run: |
          git config user.name "dola-daily bot"; git config user.email "dola-daily@users.noreply.github.com"
          mkdir -p probe && cp /tmp/post.txt probe/diag_posting.txt
          git add probe && git commit -q -m "Voice diagnostic [skip ci]" && git pull -q --rebase && git push -q
  breakdown_setup:
    needs: posting_setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-v1-ubuntu-24.04
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install -q pillow soundfile
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9"
          {
            echo "== BREAKDOWN SETUP (works)"; lsb_release -ds; python3 --version
            pip list 2>/dev/null | grep -iE "^(numpy|spacy|thinc|kokoro|misaki|torch|en.core|cython|srsly|blis|cymem|preshed|murmurhash) "
            python3 -c "import spacy; spacy.load('en_core_web_sm'); print('spacy load OK')" 2>&1 | tail -2
            python3 -c "from kokoro import KPipeline; KPipeline(lang_code='a'); print('kokoro OK')" 2>&1 | tail -3
          } > /tmp/bd.txt 2>&1
      - run: |
          git config user.name "dola-daily bot"; git config user.email "dola-daily@users.noreply.github.com"
          git pull -q; mkdir -p probe && cp /tmp/bd.txt probe/diag_breakdown.txt
          git add probe && git commit -q -m "Voice diagnostic [skip ci]" && git pull -q --rebase && git push -q
