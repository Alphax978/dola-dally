name: TikTok breakdown video
# Makes the 60-75 s "prompt breakdown" version of a day's video (free Kokoro voiceover)
# and puts it in the "demos" release for review.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day (YYYY-MM-DD)"
        type: string
        required: true
      slot:
        description: "Video 1 or 2"
        type: string
        default: "1"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DAY: ${{ inputs.day }}
      SLOT: ${{ inputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile pillow
      - name: Load the voice (Kokoro)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          start=$(date +%s)
          python3 -c "from kokoro import KPipeline; import numpy as np; p=KPipeline(lang_code='a'); a=np.concatenate([x for _,_,x in p('Testing the voice.', voice='af_heart')]); print(len(a))"
          echo "::notice title=Voice loaded::Kokoro ready in $(( $(date +%s) - start ))s"
      - name: Build the video
        timeout-minutes: 20
        run: python3 tiktok_breakdown.py "$DAY" "$SLOT" "breakdown-$DAY-$SLOT.mp4"
      - name: Upload for review
        run: |
          gh release view demos >/dev/null 2>&1 || gh release create demos --title "Demos" --notes "Demo videos for review."
          gh release upload demos "breakdown-$DAY-$SLOT.mp4" --clobber
