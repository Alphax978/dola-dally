name: TikTok connect
# One time: after signing in at https://alphax978.github.io/dola-dally/connect.html,
# paste the code it shows here. Saves the TikTok sign-in (encrypted) to the repo.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code from the Connect TikTok page"
        required: true
        type: string
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      CODE: ${{ inputs.code }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests cryptography
      - name: Connect TikTok
        run: python3 tiktok.py --connect "$CODE"
      - name: Save
        run: |
          git config user.name "dola-daily bot"; git config user.email "dola-daily@users.noreply.github.com"
          git add tiktok_token.enc && git commit -q -m "TikTok connected [skip ci]" && git pull -q --rebase && git push -q || echo "nothing new to save"
