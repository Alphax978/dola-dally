name: Post to X

on:
  schedule:  # backup only: cron-job.org starts the posts at exactly 4:30 and 9:30 Nepal time.
             # These retry every 15 min afterwards in case that call fails; a run stops at once if the video is already posted.
    - cron: "0,15,30,45 11-12 * * *"  # 16:45 to 18:30 Nepal (video 1)
    - cron: "0,15,30,45 16-17 * * *"  # 21:45 to 23:30 Nepal (video 2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (prepare everything, post nothing)"
        type: boolean
        default: true
      check_only:
        description: "Dry run: only check the accounts (about 1 minute, skips the video previews)"
        type: boolean
        default: false
      test_breakdown:
        description: "Test only: build this video's breakdown exactly as posting would and try Instagram without publishing (1 or 2)"
        type: string
        default: ""
      slot:
        description: "Post this video now (1 or 2); if it's already on X, only posts it where it's missing (YouTube/Facebook/Instagram). Leave empty to post on schedule"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: post-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE || secrets.TIKTOK_MODE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.check_only == true || inputs.check_only == 'true') && 'true' || 'false' }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests requests-oauthlib opencv-python-headless numpy cryptography

      # Extras for TikTok's breakdown video. Never blocks posting: if any of these fail or hang,
      # TikTok simply gets the normal 9:16 clip.
      - name: Restore saved downloads (voice software and model)
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-v1-ubuntu-24.04
      - name: Install breakdown extras (fonts, backup voice)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng fonts-dejavu-core
          pip install -q pillow soundfile
      - name: Install the free voice (Kokoro, in its own Python environment)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 -m venv "$HOME/voice"
          "$HOME/voice/bin/pip" install -q torch --index-url https://download.pytorch.org/whl/cpu
          "$HOME/voice/bin/pip" install -q "kokoro>=0.9" soundfile
          "$HOME/voice/bin/python" -c "import kokoro, soundfile" && echo "VOICE_PY=$HOME/voice/bin/python" >> "$GITHUB_ENV"

      - name: Test the breakdown (nothing is published)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_breakdown != '' }}
        env:
          TB: ${{ inputs.test_breakdown }}
        run: python3 post_to_x.py --test-breakdown "$TB"

      - name: Post today's videos at 16:30 and 21:30 Nepal time
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.slot == '' && inputs.test_breakdown == '') }}
        run: python3 post_to_x.py --auto $DRY

      - name: Post one video now
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slot != '' && inputs.test_breakdown == '' }}
        env:
          SLOT: ${{ inputs.slot }}
        run: python3 post_to_x.py --slot "$SLOT" $DRY
