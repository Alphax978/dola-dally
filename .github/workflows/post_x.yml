name: Post to X

on:
  schedule:  # backup only: cron-job.org starts the posts at exactly 4:30 and 9:30 Nepal time.
             # These retry every 15 min afterwards in case that call fails; a run stops at once if the video is already posted.
    - cron: "0,15,30,45 11-12 * * *"  # 16:45 to 18:30 Nepal (video 1)
    - cron: "0,15,30,45 16-17 * * *"  # 21:45 to 23:30 Nepal (video 2)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (prepare everything, post nothing)"
        type: boolean
        default: true
      check_only:
        description: "Dry run: only check the accounts (about 1 minute, skips the video previews)"
        type: boolean
        default: false
      slot:
        description: "Post this video now (1 or 2); if it's already on X, only posts it where it's missing (YouTube/Facebook/Instagram). Leave empty to post on schedule"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: post-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE || secrets.TIKTOK_MODE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.check_only == true || inputs.check_only == 'true') && 'true' || 'false' }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        timeout-minutes: 15
        run: |
          bash ci/install.sh apt ffmpeg
          bash ci/install.sh pip requests requests-oauthlib opencv-python-headless numpy cryptography

      # Extras for TikTok's breakdown video. Never blocks posting: if any of these fail or hang,
      # TikTok simply gets the normal 9:16 clip.
      - name: Restore saved downloads (voice software and model)
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-v1-ubuntu-24.04
      - name: Install breakdown extras (fonts, backup voice)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          bash ci/install.sh apt espeak-ng fonts-dejavu-core
          bash ci/install.sh pip pillow soundfile
      - name: Install the free voice (Kokoro)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          bash ci/install.sh pip torch --index-url https://download.pytorch.org/whl/cpu
          bash ci/install.sh pip "kokoro>=0.9"

      - name: Post today's videos at 16:30 and 21:30 Nepal time
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.slot == '' }}
        run: python3 post_to_x.py --auto $DRY

      - name: Post one video now
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slot != '' }}
        env:
          SLOT: ${{ inputs.slot }}
        run: python3 post_to_x.py --slot "$SLOT" $DRY
