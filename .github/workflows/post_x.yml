name: Post to X

on:
  push:
    paths:
      - prompts/x/**          # the morning routine saved today's posts: start the day's posting run
  schedule:                   # backups, in case a run didn't start (GitHub sometimes skips these)
    - cron: "0 11 * * *"      # 16:45 Nepal
    - cron: "0 16 * * *"      # 21:45 Nepal
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (prepare everything, post nothing)"
        type: boolean
        default: true
      slot:
        description: "Post this video now (1 or 2); if it's already on X, only posts it where it's missing (YouTube/Facebook/Instagram). Leave empty to post on schedule"
        type: string
        default: ""

permissions:
  contents: write
  actions: write              # lets a waiting run hand over to a new one

concurrency:
  group: post-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests requests-oauthlib opencv-python-headless numpy

      - name: Post today's videos at 16:30 and 21:30 Nepal time
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.slot == '' }}
        run: python3 post_to_x.py --auto $DRY

      - name: Post one video now
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slot != '' }}
        env:
          SLOT: ${{ inputs.slot }}
        run: python3 post_to_x.py --slot "$SLOT" $DRY
