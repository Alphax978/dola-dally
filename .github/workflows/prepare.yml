name: Prepare daily video frames

on:
  schedule:
    # cron-job.org starts this at exactly 5:00 AM Nepal time. These are backups in case that call fails;
    # a run stops at once if today's frames already exist (GitHub can also start late or skip).
    - cron: "30 23 * * *"   # 5:15 AM Nepal
    - cron: "45 23 * * *"   # 5:30 AM Nepal
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    paths:
      - run-now.txt           # editing this file starts a run (used for test runs)

permissions:
  contents: write

concurrency:
  group: prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q opencv-python-headless numpy

      - name: Download videos and make frame grids
        run: python3 prepare_frames.py

      - name: Write today's prompts with Gemini (only when writer.txt says gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          pip install -q requests cryptography
          python3 gemini_writer.py --if-mode gemini

      - name: Save to the repo
        if: always()
        run: |
          git config user.name "dola-daily bot"
          git config user.email "dola-daily@users.noreply.github.com"
          git add -A days used.json picks.txt prompts breakdowns tg_chat.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Frames for $(TZ=Asia/Kathmandu date +%F)" && git pull --rebase && git push)
