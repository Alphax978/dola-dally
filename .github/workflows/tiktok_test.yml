name: TikTok test post
# Posts one of today's videos to TikTok in direct mode (private until TikTok audits the app).
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which of today's videos (1 or 2)"
        default: "1"
        type: string
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      SLOT: ${{ inputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests requests-oauthlib opencv-python-headless numpy cryptography
      - name: Post to TikTok (direct)
        run: python3 tiktok_test.py "$SLOT"
