name: X connect
# Connect a (new) X account to our X app. Run once with the PIN empty: the run's summary shows a link.
# Open it while signed in to the new account, press Authorize, then run again with the PIN.
on:
  workflow_dispatch:
    inputs:
      pin:
        description: "PIN from X (leave empty to get the link first)"
        required: false
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: post-x   # never in the middle of a post
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      PIN: ${{ inputs.pin }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        timeout-minutes: 8
        run: pip install -q requests requests-oauthlib cryptography
      - name: Connect X
        run: |
          if [ -z "$PIN" ]; then python3 x_connect.py --start; else python3 x_connect.py --pin "$PIN"; fi
      - name: Save
        run: |
          git config user.name "dola-daily bot"; git config user.email "dola-daily@users.noreply.github.com"
          for f in x_request.enc x_token.enc x_connect_link.txt; do git add -A -- "$f" 2>/dev/null || true; done
          git diff --cached --quiet || (git commit -q -m "X connection updated [skip ci]" && git pull -q --rebase && git push -q)
